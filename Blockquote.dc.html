<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<blockquote style="font-weight: 500; font-size: clamp(1rem, 0.92rem + 0.3vw, 1.15rem); line-height: 1.5; border-left: 3px solid #6b6863; background: #f2f1ec; padding: 1.25rem 1.5rem; margin: 0;">
  {{ quote }}
  <sc-if value="{{ hasAuthor }}" hint-placeholder-val="{{ false }}">
    <cite style="display: block; font-style: normal; font-size: 0.9rem; color: #6b6863; margin-top: 0.75rem;">— {{ author }}</cite>
  </sc-if>
</blockquote>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 640, &quot;height&quot;: 140}, &quot;quote&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;A representative pull quote.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;author&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    var author = this.props.author || '';
    return {
      quote: this.props.quote ?? '',
      author: author,
      hasAuthor: !!author,
    };
  }
}
</script>
</body>
</html>
