<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <style>
    @keyframes ncsBlobA { 0% { transform: translate(-10%, -10%) scale(1); } 50% { transform: translate(15%, 10%) scale(1.15); } 100% { transform: translate(-10%, -10%) scale(1); } }
    @keyframes ncsBlobB { 0% { transform: translate(10%, 15%) scale(1); } 50% { transform: translate(-15%, -10%) scale(1.1); } 100% { transform: translate(10%, 15%) scale(1); } }
    .ncs-thumb { flex: 0 0 160px; }
    @media (min-width: 640px) { .ncs-thumb { flex-basis: 280px; } }
  </style>
</helmet>

<section class="cs-col" style="padding-top: 3rem; padding-bottom: 4rem; border-top: 1px solid #e4e0d8; max-width: 760px; margin-left: auto; margin-right: auto;">
  <div style="font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #6b6863; margin-bottom: 1.5rem;">Next case study</div>
  <a href="{{ href }}" style="display: flex; gap: 1.5rem; align-items: center; text-decoration: none; color: inherit; --deepen: 0;" style-hover="--deepen: 1;">
    <div class="ncs-thumb" style="aspect-ratio: 16 / 10; position: relative; overflow: hidden; border-radius: 14px; background: #ebe8e2; box-sizing: border-box;">
      <div style="position: absolute; inset: 0; overflow: hidden; filter: saturate(calc(1 + var(--deepen, 0) * 0.45)) brightness(calc(1 - var(--deepen, 0) * 0.1)); transition: filter 0.35s ease;">
        <div style="position: absolute; width: 70%; height: 70%; left: 5%; top: 0%; border-radius: 50%; background: {{ color1 }}; filter: blur(26px); animation: ncsBlobA 18s ease-in-out infinite;"></div>
        <div style="position: absolute; width: 60%; height: 60%; right: 0%; bottom: 0%; border-radius: 50%; background: {{ color2 }}; filter: blur(26px); animation: ncsBlobB 22s ease-in-out infinite;"></div>
      </div>
      <img src="{{ image }}" alt="{{ imageAlt }}" style="position: relative; z-index: 1; width: 100%; height: 100%; object-fit: contain; padding: 16px; box-sizing: border-box; display: block; transform: scale(calc(1 + var(--deepen, 0) * 0.01)); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);">
    </div>
    <div style="flex: 1; min-width: 0;">
      <div style="font-family: 'Mori', -apple-system, system-ui, sans-serif; font-size: 0.85rem; color: #6b6863; font-weight: 600; margin-bottom: 0.35em;">{{ eyebrow }}</div>
      <div style="font-family: 'Mori', -apple-system, system-ui, sans-serif; font-size: clamp(1.05rem, 1rem + 0.4vw, 1.25rem); font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 0.5em;">
        {{ title }}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; flex-shrink: 0; transform: translateX(calc(var(--deepen, 0) * 4px)); transition: transform 0.3s ease;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </div>
    </div>
  </a>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 760, &quot;height&quot;: 180}, &quot;eyebrow&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;LinkedIn&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Quick reply for job candidates&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;href&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;image&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;imageAlt&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color1&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;oklch(0.9 0.04 150)&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;color2&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;oklch(0.82 0.06 150)&quot;, &quot;tsType&quot;: &quot;string&quot;}}"></script>
</body>
</html>
