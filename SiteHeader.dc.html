<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    .nav-desktop, .contact-desktop { display: flex; }
    .nav-mobile-toggle { display: none; }
    @media (max-width: 768px) { .nav-desktop { display: none !important; } .nav-mobile-toggle { display: flex !important; } .contact-desktop-wrap { display: none !important; } .site-header-row { padding-top: 0.75rem !important; padding-bottom: 0.75rem !important; } }
    .header-spacer-default { height: 76px; }
  </style>
</helmet>
<header ref="{{ siteHeaderRef }}" style="position: fixed; top: 0; left: 0; right: 0; z-index: 5; width: 100%; box-sizing: border-box; background: rgba(249,248,247,0.72); backdrop-filter: blur(14px) saturate(1.6); -webkit-backdrop-filter: blur(14px) saturate(1.6); border-bottom: 1px solid #e4e0d8; margin-bottom: -1px; transform: {{ siteHeaderTransform }}; transition: transform 0.3s ease;">
  <div class="site-header-row" style="max-width: 1280px; margin: 0 auto; padding: 1rem clamp(1.25rem, 4vw, 3rem); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
    <a href="index.html" class="site-header-logo" style="display: flex; align-items: center; gap: 0.55rem; font-weight: 400; font-size: 1.05rem; letter-spacing: 0.02em; color: #14130f; text-decoration: none;">
      <img src="assets/img/logo-mark-solid.svg" alt="" style="width: 22px; height: 22px; display: block; flex-shrink: 0;">
      Jia Liu
    </a>
    <div style="display: flex; align-items: center; gap: 1.75rem;">
      <nav class="nav-desktop" style="display: flex; gap: 1.5rem;">
        <a href="index.html#work" onClick="{{ handleNavLinkClick }}" data-section-id="work" style="font-size: 1.05rem; font-weight: 500; color: #14130f; opacity: 0.75; text-decoration: none;" style-hover="opacity: 1;">Work</a>
        <a href="assets/Jia-Liu-Resume.pdf" target="_blank" rel="noopener" style="font-size: 1.05rem; font-weight: 500; color: #14130f; opacity: 0.75; text-decoration: none;" style-hover="opacity: 1;">Resume</a>
        <a href="index.html#about" onClick="{{ handleNavLinkClick }}" data-section-id="about" style="font-size: 1.05rem; font-weight: 500; color: #14130f; opacity: 0.75; text-decoration: none;" style-hover="opacity: 1;">Bio</a>
      </nav>
      <button class="nav-mobile-toggle" onClick="{{ toggleMobileNav }}" aria-label="Menu" aria-expanded="{{ mobileNavOpen }}" style="display: none; align-items: center; justify-content: center; width: 34px; height: 34px; background: none; border: none; cursor: pointer; color: #14130f; padding: 0; flex-shrink: 0;">
        <sc-if value="{{ mobileNavOpen }}" hint-placeholder-val="{{ false }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width: 22px; height: 22px;"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </sc-if>
        <sc-if value="{{ mobileNavClosed }}" hint-placeholder-val="{{ true }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width: 22px; height: 22px;"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        </sc-if>
      </button>
      <div ref="{{ contactWrapRef }}" class="contact-desktop-wrap" style="position: relative; width: 128px; height: 42px; flex-shrink: 0;">
        <div style="position: absolute; top: 0; right: 0; background: #14130f; overflow: hidden; width: {{ contactShapeWidth }}; height: {{ contactShapeHeight }}; border-radius: {{ contactShapeRadius }}; box-shadow: {{ contactShapeShadow }}; transition: width 0.45s cubic-bezier(0.16,1,0.3,1), height 0.45s cubic-bezier(0.16,1,0.3,1), border-radius 0.45s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease; z-index: 20;">
          <button class="contact-desktop" onClick="{{ toggleContact }}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0.5em; background: none; border: none; color: #ffffff; font-family: 'Mori', -apple-system, system-ui, sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; white-space: nowrap; opacity: {{ contactButtonContentOpacity }}; pointer-events: {{ contactButtonPointerEvents }}; transition: opacity 0.2s ease {{ contactButtonContentDelay }};">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width: 14px; height: 14px; transform: rotate(-45deg); flex-shrink: 0;"><path d="M2 21l21-9L2 3v7l15 2-15 2z"></path></svg>
            Contact
          </button>
          <div style="position: absolute; inset: 0; padding: 1.4rem 1.5rem; box-sizing: border-box; opacity: {{ contactCardContentOpacity }}; pointer-events: {{ contactCardPointerEvents }}; transition: opacity 0.25s ease {{ contactCardContentDelay }};">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.1rem;">
              <span style="font-size: 0.95rem; color: #9a968f;">Get in touch</span>
              <button onClick="{{ closeContact }}" aria-label="Close" style="background: none; border: none; color: #9a968f; cursor: pointer; padding: 0; display: flex;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;"><path d="M18 6L6 18M6 6l12 12"></path></svg>
              </button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
              <div>
                <div style="font-size: 0.82rem; color: #9a968f; margin-bottom: 0.2em;">Email</div>
                <div style="font-size: 1rem; font-weight: 400; color: #ffffff;">jia.eq.liu@gmail.com</div>
              </div>
              <button onClick="{{ copyEmail }}" aria-label="Copy email" style="background: rgba(255,255,255,0.1); border: none; border-radius: 8px; width: 34px; height: 34px; color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <sc-if value="{{ emailCopied }}" hint-placeholder-val="{{ false }}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M20 6L9 17l-5-5"></path></svg>
                </sc-if>
                <sc-if value="{{ notEmailCopied }}" hint-placeholder-val="{{ true }}">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
                </sc-if>
              </button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div>
                <div style="font-size: 0.82rem; color: #9a968f; margin-bottom: 0.2em;">LinkedIn</div>
                <div style="font-size: 1rem; font-weight: 400; color: #ffffff;">@jia-eq-liu</div>
              </div>
              <a href="https://www.linkedin.com/in/jia-eq-liu/" target="_blank" rel="noopener" aria-label="Open LinkedIn" style="background: rgba(255,255,255,0.1); border-radius: 8px; width: 34px; height: 34px; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="width: 100%; box-sizing: border-box; overflow: hidden; max-height: {{ mobileNavMaxHeight }}; border-top: 1px solid #e4e0d8; transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
   <div style="max-width: 1280px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 3rem); box-sizing: border-box;">
    <nav style="display: flex; flex-direction: column; padding-bottom: 1rem; padding-top: 0.75rem;">
      <a href="index.html#work" onClick="{{ handleMobileNavLinkClick }}" data-section-id="work" style="font-size: 1.05rem; font-weight: 500; color: #14130f; text-decoration: none; padding: 0.6rem 0;">Work</a>
      <a href="assets/Jia-Liu-Resume.pdf" target="_blank" rel="noopener" onClick="{{ closeMobileNav }}" style="font-size: 1.05rem; font-weight: 500; color: #14130f; text-decoration: none; padding: 0.6rem 0;">Resume</a>
      <a href="index.html#about" onClick="{{ handleMobileNavLinkClick }}" data-section-id="about" style="font-size: 1.05rem; font-weight: 500; color: #14130f; text-decoration: none; padding: 0.6rem 0;">Bio</a>
      <button onClick="{{ toggleMobileContact }}" aria-expanded="{{ mobileContactOpen }}" style="background: none; border: none; text-align: left; font-family: inherit; font-size: 1.05rem; font-weight: 500; color: #14130f; padding: 0.6rem 0; cursor: pointer; display: flex; align-items: center; justify-content: space-between;">
        Contact
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; transform: {{ mobileContactChevronTransform }}; transition: transform 0.25s ease;"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
      <div style="overflow: hidden; max-height: {{ mobileContactMaxHeight }}; transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
        <div style="padding: 0.25rem 0 1rem;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
            <div>
              <div style="font-size: 0.78rem; color: #6b6863; margin-bottom: 0.2em;">Email</div>
              <div style="font-size: 0.95rem; font-weight: 500; color: #14130f;">jia.eq.liu@gmail.com</div>
            </div>
            <button onClick="{{ copyEmail }}" aria-label="Copy email" style="background: #f2f1ec; border: none; border-radius: 8px; width: 34px; height: 34px; color: #14130f; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <sc-if value="{{ emailCopied }}" hint-placeholder-val="{{ false }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M20 6L9 17l-5-5"></path></svg>
              </sc-if>
              <sc-if value="{{ notEmailCopied }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
              </sc-if>
            </button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-size: 0.78rem; color: #6b6863; margin-bottom: 0.2em;">LinkedIn</div>
              <div style="font-size: 0.95rem; font-weight: 500; color: #14130f;">@jia-eq-liu</div>
            </div>
            <a href="https://www.linkedin.com/in/jia-eq-liu/" target="_blank" rel="noopener" aria-label="Open LinkedIn" style="background: #f2f1ec; border-radius: 8px; width: 34px; height: 34px; color: #14130f; display: flex; align-items: center; justify-content: center; flex-shrink: 0; text-decoration: none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><path d="M15 3h6v6"></path><path d="M10 14L21 3"></path></svg>
            </a>
          </div>
        </div>
      </div>
    </nav>
   </div>
  </div>
</header>
<div class="header-spacer-default" style="height: {{ headerSpacerHeight }}; flex-shrink: 0;"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 80}}">
class Component extends DCLogic {
  siteHeaderRef = React.createRef();
  contactWrapRef = React.createRef();
  lastSiteHeaderScrollY = 0;
  siteHeaderScrollAccum = 0;
  siteHeaderScrollDir = 0;
  state = { siteHeaderHidden: false, siteHeaderHeightPx: 72, contactOpen: false, emailCopied: false, mobileNavOpen: false, mobileContactOpen: false };

  componentDidMount() {
    this.onSiteHeaderScroll = this.onSiteHeaderScroll.bind(this);
    window.addEventListener('scroll', this.onSiteHeaderScroll, { passive: true });
    this.handleDocClick = this.handleDocClick.bind(this);
    document.addEventListener('mousedown', this.handleDocClick);
    document.addEventListener('touchstart', this.handleDocClick, { passive: true });
    this.onKeyDown = this.onKeyDown.bind(this);
    document.addEventListener('keydown', this.onKeyDown);
    this.measureHeaderHeight = this.measureHeaderHeight.bind(this);
    this.measureHeaderHeight();
    window.addEventListener('resize', this.measureHeaderHeight);
    if (this.props.onHiddenChange) {
      var headerH = this.siteHeaderRef.current ? this.siteHeaderRef.current.offsetHeight : 72;
      this.props.onHiddenChange(false, headerH);
    }
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onSiteHeaderScroll);
    document.removeEventListener('mousedown', this.handleDocClick);
    document.removeEventListener('touchstart', this.handleDocClick);
    document.removeEventListener('keydown', this.onKeyDown);
    window.removeEventListener('resize', this.measureHeaderHeight);
  }

  measureHeaderHeight() {
    var el = this.siteHeaderRef.current;
    if (!el) return;
    var h = el.offsetHeight;
    if (h && h !== this.state.siteHeaderHeightPx) this.setState({ siteHeaderHeightPx: h });
  }

  onKeyDown(e) {
    if (e.key === 'Escape') {
      if (this.state.contactOpen) this.setState({ contactOpen: false });
      if (this.state.mobileContactOpen) this.setState({ mobileContactOpen: false });
      else if (this.state.mobileNavOpen) this.setState({ mobileNavOpen: false });
    }
  }

  toggleContact() { this.setState(function (s) { return { contactOpen: !s.contactOpen }; }); }
  closeContact() { this.setState({ contactOpen: false }); }

  handleDocClick(e) {
    if (this.state.contactOpen) {
      var el = this.contactWrapRef.current;
      if (el && !el.contains(e.target)) this.setState({ contactOpen: false });
    }
    if (this.state.mobileNavOpen) {
      var headerEl = this.siteHeaderRef.current;
      if (headerEl && !headerEl.contains(e.target)) {
        this.setState({ mobileNavOpen: false, mobileContactOpen: false });
      }
    }
  }

  copyEmail() {
    var self = this;
    var email = 'jia.eq.liu@gmail.com';
    var flash = function () {
      self.setState({ emailCopied: true });
      setTimeout(function () { self.setState({ emailCopied: false }); }, 1800);
    };
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = email;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, email.length);
        document.execCommand('copy');
        document.body.removeChild(ta);
        flash();
      } catch (err) {}
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(flash).catch(fallback);
    } else {
      fallback();
    }
  }

  toggleMobileNav() {
    this.setState(function (s) { return { mobileNavOpen: !s.mobileNavOpen }; });
  }

  closeMobileNav() {
    this.setState({ mobileNavOpen: false, mobileContactOpen: false });
  }

  toggleMobileContact() {
    this.setState(function (s) { return { mobileContactOpen: !s.mobileContactOpen }; });
  }

  scrollToSectionIfPresent(e) {
    var id = e.currentTarget.getAttribute('data-section-id');
    var el = document.getElementById(id);
    if (el) {
      e.preventDefault();
      var top = el.getBoundingClientRect().top + window.scrollY - 88;
      window.scrollTo({ top: top, behavior: 'smooth' });
      return true;
    }
    return false;
  }

  handleNavLinkClick(e) {
    this.scrollToSectionIfPresent(e);
  }

  handleMobileNavLinkClick(e) {
    this.scrollToSectionIfPresent(e);
    this.closeMobileNav();
  }

  onSiteHeaderScroll() {
    var y = window.scrollY || window.pageYOffset;
    var headerH = this.siteHeaderRef.current ? this.siteHeaderRef.current.offsetHeight : 72;
    var hidden = this.state.siteHeaderHidden;
    if (y <= headerH) {
      hidden = false;
    } else if (y > this.lastSiteHeaderScrollY) {
      hidden = true;
    } else if (y < this.lastSiteHeaderScrollY) {
      hidden = false;
    }
    if (hidden !== this.state.siteHeaderHidden || headerH !== this.state.siteHeaderHeightPx) {
      this.setState({ siteHeaderHidden: hidden, siteHeaderHeightPx: headerH });
      if (this.props.onHiddenChange) this.props.onHiddenChange(hidden, headerH);
    }
    this.lastSiteHeaderScrollY = y;
  }

  renderVals() {
    return {
      siteHeaderRef: this.siteHeaderRef,
      siteHeaderTransform: this.state.siteHeaderHidden ? 'translateY(-100%)' : 'translateY(0)',
      headerSpacerHeight: this.state.siteHeaderHeightPx + 'px',
      mobileNavOpen: this.state.mobileNavOpen,
      mobileNavClosed: !this.state.mobileNavOpen,
      mobileNavMaxHeight: this.state.mobileNavOpen ? (this.state.mobileContactOpen ? '480px' : '220px') : '0px',
      toggleMobileNav: this.toggleMobileNav.bind(this),
      closeMobileNav: this.closeMobileNav.bind(this),
      toggleMobileContact: this.toggleMobileContact.bind(this),
      mobileContactOpen: this.state.mobileContactOpen,
      mobileContactMaxHeight: this.state.mobileContactOpen ? '160px' : '0px',
      mobileContactChevronTransform: this.state.mobileContactOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      handleNavLinkClick: this.handleNavLinkClick.bind(this),
      handleMobileNavLinkClick: this.handleMobileNavLinkClick.bind(this),
      contactWrapRef: this.contactWrapRef,
      contactShapeWidth: this.state.contactOpen ? '280px' : '128px',
      contactShapeHeight: this.state.contactOpen ? '216px' : '42px',
      contactShapeRadius: this.state.contactOpen ? '20px' : '999px',
      contactShapeShadow: this.state.contactOpen ? '0 24px 48px rgba(20,19,15,0.28)' : 'none',
      contactButtonContentOpacity: this.state.contactOpen ? 0 : 1,
      contactButtonContentDelay: this.state.contactOpen ? '0s' : '0.25s',
      contactButtonPointerEvents: this.state.contactOpen ? 'none' : 'auto',
      contactCardContentOpacity: this.state.contactOpen ? 1 : 0,
      contactCardContentDelay: this.state.contactOpen ? '0.2s' : '0s',
      contactCardPointerEvents: this.state.contactOpen ? 'auto' : 'none',
      toggleContact: this.toggleContact.bind(this),
      closeContact: this.closeContact.bind(this),
      copyEmail: this.copyEmail.bind(this),
      emailCopied: this.state.emailCopied,
      notEmailCopied: !this.state.emailCopied,
    };
  }
}
</script>
</body>
</html>
