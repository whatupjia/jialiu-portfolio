<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.__resources = {};</script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @media (max-width: 900px) {
      .expandable-image-wrap { width: 100% !important; margin-left: 0 !important; }
    }
  </style>
</helmet>
<div ref="{{ imgWrapRef }}" class="expandable-image-wrap" style="border-radius: 10px; overflow: hidden; background: {{ bgColor }}; border: 1px solid #e4e0d8; position: relative; box-sizing: border-box; margin-left: {{ marginLeftPx }}px; width: {{ widthPxCss }}; max-width: none; max-height: {{ maxPreviewHeightCss }}; padding: {{ paddingPx }}px; display: block;">
  <sc-if value="{{ isVideo }}" hint-placeholder-val="{{ false }}">
    <video ref="{{ previewVideoRef }}" autoplay="" loop="" muted="" playsinline="" preload="auto" onClick="{{ openModal }}" style="width: 100%; height: auto; display: block; cursor: zoom-in;"><sc-if value="{{ hasWebm }}" hint-placeholder-val="{{ false }}"><source src="{{ webmSrc }}" type="video/webm" /></sc-if><sc-if value="{{ hasMp4 }}" hint-placeholder-val="{{ true }}"><source src="{{ mp4Src }}" type="video/mp4" /></sc-if></video>
  </sc-if>
  <sc-if value="{{ isImage }}" hint-placeholder-val="{{ true }}">
    <img src="{{ src }}" alt="{{ alt }}" onClick="{{ openModal }}" style="width: 100%; height: auto; display: block; cursor: zoom-in;" />
  </sc-if>
  <sc-if value="{{ hasCrop }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(to bottom, rgba(20,19,15,0), rgba(20,19,15,0.35)); pointer-events: none;"></div>
  </sc-if>
  <button onClick="{{ openModal }}" style="position: absolute; right: 12px; bottom: 12px; background: rgba(20,19,15,0.8); color: #ffffff; font-size: 0.8rem; padding: 7px 12px; border-radius: 6px; display: flex; align-items: center; gap: 0.4em; font-weight: 600; border: none; cursor: zoom-in; pointer-events: none;"><span style="font-size: 0.95rem; line-height: 1;">⤢</span>Expand</button>
</div>

<sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
  <div ref="{{ overlayRef }}" onClick="{{ handleOverlayClick }}" onWheel="{{ handleWheel }}" style="position: fixed; inset: 0; background: rgba(20,19,15,0.85); z-index: 100; overflow: auto; padding: 3rem; box-sizing: border-box;">
    <button onClick="{{ closeModal }}" aria-label="Close" style="position: fixed; top: 24px; right: 24px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #ffffff; font-size: 1.2rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 101;">✕</button>
    <div onClick="{{ handleOverlayClick }}" style="min-height: 100%; min-width: 100%; display: flex;">
      <sc-if value="{{ isVideo }}" hint-placeholder-val="{{ false }}">
        <video ref="{{ modalImgRef }}" autoplay="" loop="" muted="" playsinline="" onMouseDown="{{ handleDragStart }}" onClick="{{ handleImageClick }}" style="width: {{ zoomWidthVw }}vw; max-width: none; height: auto; margin: auto; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); cursor: {{ dragCursor }}; user-select: none; background: #ffffff;"><sc-if value="{{ hasWebm }}" hint-placeholder-val="{{ false }}"><source src="{{ webmSrc }}" type="video/webm" /></sc-if><sc-if value="{{ hasMp4 }}" hint-placeholder-val="{{ true }}"><source src="{{ mp4Src }}" type="video/mp4" /></sc-if></video>
      </sc-if>
      <sc-if value="{{ isImage }}" hint-placeholder-val="{{ true }}">
        <img ref="{{ modalImgRef }}" src="{{ src }}" alt="{{ alt }}" onMouseDown="{{ handleDragStart }}" onClick="{{ handleImageClick }}" style="width: {{ zoomWidthVw }}vw; max-width: none; height: auto; margin: auto; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); cursor: {{ dragCursor }}; user-select: none; background: #ffffff;" />
      </sc-if>
    </div>
    <div style="position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.12); color: #ffffff; font-size: 0.75rem; padding: 6px 12px; border-radius: 6px; white-space: nowrap;">Scroll to pan · Ctrl/Cmd + scroll to zoom · click to zoom out / close</div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 320}, &quot;src&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;alt&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;background&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;white&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;white&quot;, &quot;light-gray&quot;, &quot;gray&quot;, &quot;dark-gray&quot;], &quot;section&quot;: &quot;Appearance&quot;}, &quot;breakoutLeftRef&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;React.RefObject&lt;HTMLElement&gt;&quot;}, &quot;breakoutRightRef&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;React.RefObject&lt;HTMLElement&gt;&quot;}, &quot;initialWidth&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;width&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;maxPreviewHeight&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}, &quot;padding&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  imgWrapRef = React.createRef();
  overlayRef = React.createRef();
  modalImgRef = React.createRef();
  previewVideoRef = React.createRef();
  dragging = false;
  dragStart = { x: 0, y: 0, scrollLeft: 0, scrollTop: 0 };
  state = { modalOpen: false, marginLeftPx: 0, widthPx: this.props.initialWidth || 0, zoom: 1 };

  componentDidMount() {
    this.ensurePreviewMuted();
    this.openModal = this.openModal.bind(this);
    this.closeModal = this.closeModal.bind(this);
    this.handleKeydown = this.handleKeydown.bind(this);
    this.measureBreakout = this.measureBreakout.bind(this);
    this.handleOverlayClick = this.handleOverlayClick.bind(this);
    this.handleWheel = this.handleWheel.bind(this);
    this.handleDragStart = this.handleDragStart.bind(this);
    this.handleDragMove = this.handleDragMove.bind(this);
    this.handleDragEnd = this.handleDragEnd.bind(this);
    this.handleImageClick = this.handleImageClick.bind(this);
    window.addEventListener('keydown', this.handleKeydown);
    if (this.props.breakoutLeftRef && this.props.breakoutRightRef) {
      this.measureBreakout();
      window.addEventListener('resize', this.measureBreakout);
    }
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this.handleKeydown);
    window.removeEventListener('resize', this.measureBreakout);
    window.removeEventListener('mousemove', this.handleDragMove);
    window.removeEventListener('mouseup', this.handleDragEnd);
  }

  componentDidUpdate() { this.ensurePreviewMuted(); }

  ensurePreviewMuted() {
    var v = this.previewVideoRef.current;
    if (!v) return;
    v.muted = true;
    v.loop = true;
    if (!this._loopBound) {
      this._loopBound = true;
      v.addEventListener('ended', function () { v.currentTime = 0; v.play().catch(function () {}); });
    }
    if (v.paused) v.play().catch(function () {});
  }

  openModal() {
    var isMobile = window.matchMedia('(max-width: 768px)').matches;
    this.setState({ modalOpen: true, zoom: isMobile ? 2 : 1 });
    var self = this;
    requestAnimationFrame(function () {
      var v = self.modalImgRef.current;
      if (v && v.tagName === 'VIDEO') {
        v.muted = true;
        v.loop = true;
        if (v.paused) v.play().catch(function () {});
      }
    });
  }
  closeModal() { this.setState({ modalOpen: false }); }
  handleKeydown(e) { if (e.key === 'Escape' && this.state.modalOpen) this.closeModal(); }
  handleOverlayClick(e) { if (e.target !== this.modalImgRef.current) this.closeModal(); }
  handleImageClick(e) {
    e.stopPropagation();
    if (this.dragMoved) { this.dragMoved = false; return; }
    if (this.state.zoom > 1) this.setState({ zoom: 1 });
    else this.closeModal();
  }

  handleWheel(e) {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    var next = this.state.zoom - e.deltaY * 0.01;
    next = Math.max(1, Math.min(4, next));
    if (next !== this.state.zoom) this.setState({ zoom: next });
  }

  handleDragStart(e) {
    if (this.state.zoom <= 1) return;
    this.dragging = true;
    this.dragMoved = false;
    var el = this.overlayRef.current;
    this.dragStart = { x: e.clientX, y: e.clientY, scrollLeft: el.scrollLeft, scrollTop: el.scrollTop };
    window.addEventListener('mousemove', this.handleDragMove);
    window.addEventListener('mouseup', this.handleDragEnd);
  }

  handleDragMove(e) {
    if (!this.dragging) return;
    this.dragMoved = true;
    var el = this.overlayRef.current;
    if (!el) return;
    el.scrollLeft = this.dragStart.scrollLeft - (e.clientX - this.dragStart.x);
    el.scrollTop = this.dragStart.scrollTop - (e.clientY - this.dragStart.y);
  }

  handleDragEnd() {
    this.dragging = false;
    window.removeEventListener('mousemove', this.handleDragMove);
    window.removeEventListener('mouseup', this.handleDragEnd);
  }

  measureBreakout() {
    var imgEl = this.imgWrapRef.current;
    var leftEl = this.props.breakoutLeftRef.current;
    var rightEl = this.props.breakoutRightRef.current;
    if (!imgEl || !leftEl || !rightEl || !imgEl.parentElement) return;
    var parentRect = imgEl.parentElement.getBoundingClientRect();
    var leftRect = leftEl.getBoundingClientRect();
    var rightRect = rightEl.getBoundingClientRect();
    var newMarginLeft = Math.round(leftRect.left - parentRect.left);
    var newWidth = Math.round(rightRect.right - leftRect.left);
    if (newMarginLeft !== this.state.marginLeftPx || newWidth !== this.state.widthPx) {
      this.setState({ marginLeftPx: newMarginLeft, widthPx: newWidth });
    }
  }

  renderVals() {
    return {
      imgWrapRef: this.imgWrapRef,
      previewVideoRef: this.previewVideoRef,
      isVideo: !!(this.props.webmSrc || this.props.mp4Src),
      isImage: !(this.props.webmSrc || this.props.mp4Src),
      hasWebm: !!this.props.webmSrc,
      hasMp4: !!this.props.mp4Src,
      webmSrc: this.props.webmSrc,
      mp4Src: this.props.mp4Src,
      src: this.props.src,
      alt: this.props.alt || '',
      modalOpen: this.state.modalOpen,
      openModal: this.openModal,
      closeModal: this.closeModal,
      marginLeftPx: this.state.marginLeftPx,
      widthPxCss: (function () {
        var w = this.props.width != null ? this.props.width : (this.props.breakoutLeftRef ? this.state.widthPx : '100%');
        return typeof w === 'number' ? w + 'px' : w;
      }).call(this),
      maxPreviewHeightCss: this.props.maxPreviewHeight != null ? this.props.maxPreviewHeight + 'px' : 'none',
      paddingPx: this.props.padding != null ? this.props.padding : 0,
      hasCrop: this.props.maxPreviewHeight != null,
      bgColor: ({ white: '#ffffff', 'light-gray': '#f2f1ec', gray: '#e4e0d8', 'dark-gray': '#6b6863' })[this.props.background] || '#ffffff',
      overlayRef: this.overlayRef,
      modalImgRef: this.modalImgRef,
      handleOverlayClick: this.handleOverlayClick,
      handleWheel: this.handleWheel,
      handleDragStart: this.handleDragStart,
      handleImageClick: this.handleImageClick,
      zoomWidthVw: Math.round(90 * this.state.zoom),
      dragCursor: this.state.zoom > 1 ? 'grab' : 'zoom-in',
    };
  }
}
</script>
</body>
</html>
